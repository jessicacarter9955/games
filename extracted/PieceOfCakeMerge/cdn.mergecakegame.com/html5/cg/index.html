<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, shrink-to-fit=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Piece of Cake</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      id="game-frame"
      title="Piece of Cake"
      allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media; payment; gamepad; cross-origin-isolated; accelerometer; gyroscope; microphone; camera; display-capture; screen-wake-lock"
      allowfullscreen="true"
    ></iframe>
    <script>
      (function () {
        var frame = document.getElementById("game-frame");
        var hasParent = window.parent !== window;

        window.addEventListener("message", function (event) {
          var fromGame =
            frame.contentWindow && event.source === frame.contentWindow;
          var fromTop = hasParent && event.source === window.parent;

          if (fromGame) {
            if (hasParent) {
              try {
                window.parent.postMessage(event.data, "*");
              } catch (e) {}
            }
          } else if (fromTop) {
            try {
              if (frame.contentWindow) {
                frame.contentWindow.postMessage(event.data, "*");
              }
            } catch (e) {}
          }
        });

        var qs = window.location.search;
        var sep = qs ? "&" : "?";
        frame.src =
          "game.html" + qs + sep + "_=" + Date.now() + window.location.hash;
      })();
    </script>
  </body>
</html>
