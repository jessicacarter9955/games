      .canvas-app-container {

      .canvas-app-canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .canvas-app-canvas {
        display: block;
        outline: none;
        border: 0;
        width: 100%;

      canvas {

      .canvas-app-progress {

        left: 0;
        bottom: 0;

      .orientation-warning {
        position: absolute;

        justify-content: center;
        align-items: center;
        width: 100%;

        text-align: center;
      }

      .rotate-image {
        opacity: 0;
        width: 35%;
        animation: fadeInOut 3s infinite;
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
          transform: rotate(-45deg);
        }
        20% {
          opacity: 1;
        }
        50% {
          transform: rotate(45deg);
        }
        80% {
          opacity: 1;
          transform: rotate(45deg);
        }
        100% {
          opacity: 0;
          transform: rotate(45deg);
        }

      .orientation-warning-is-visible {

      .close-button {
        position: absolute;

      .close-button:hover {

    <script>
      function checkNotExists(param) {
        return typeof param === "undefined" || param === null;
      }
      document.addEventListener("DOMContentLoaded", function () {
        if (
          checkNotExists(window.adapter) ||

        resizeGameCanvas();
        checkOrientation();

        socialPlatform.onCanvasResize = resizeGameCanvas;
        socialPlatform.setBannerContainerVisible = function (visible) {

            ).style.visibility = (visible && "visible") || "hidden";
            document.getElementById(window.BANNER_CONTAINER_ID).style.zIndex =

          }

        window.addEventListener("orientationchange", checkOrientation);
        window.addEventListener("focus", resizeGameCanvas);

        gameCanvas.addEventListener("wheel", function (event) {

        CUSTOM_PARAMETERS.can_not_download_file_callback =
          handleFileDownloadError;
        CUSTOM_PARAMETERS.resize_window_callback = resizeGameCanvas;
        (CUSTOM_PARAMETERS.archive_location_filter = function (path) {

        EngineLoader.load("canvas", "PieceofCake_1794906512");

      const maxAttempts = 5;
      const retryInterval = 500;

      var MIN_AR = 4 / 3;
      var MAX_AR = 18.5 / 9;
      var TARGET_WIDTH = 1136;
      var TARGET_HEIGHT = 640;
      var BANNER_HEIGHT = document.getElementById(
        window.BANNER_CONTAINER_ID
      ).clientHeight;
      var BANNER_WIDTH = document.getElementById(
        window.BANNER_CONTAINER_ID
      ).clientWidth;

      var appContainer = document.getElementById("app-container");
      var gameCanvas = document.getElementById("canvas");

      var prevInnerWidth = -1;
      var prevInnerHeight = -1;
      var targetRatio = TARGET_WIDTH / TARGET_HEIGHT;

      function oddSize(size) {
        return size % 2 == 1 ? size - 1 : size;
      }

      function resizeGameCanvas() {
        var bannerSize =
          (socialPlatform && socialPlatform.isBannerShown()) || false
            ? BANNER_HEIGHT
            : 0;
        var innerWidth = Math.max(1, document.documentElement.clientWidth);
        var innerHeight = Math.max(
          1,
          document.documentElement.clientHeight - bannerSize
        );

        if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight) {
          return;
        }

        prevInnerWidth = innerWidth;
        prevInnerHeight = innerHeight;

        var width = TARGET_WIDTH;
        var height = TARGET_HEIGHT;
        var actualRatio = innerWidth / innerHeight;

        if (actualRatio > targetRatio) {
          actualRatio = Math.min(actualRatio, MAX_AR);
          width = Math.max(1, Math.floor(innerHeight * actualRatio));
          height = innerHeight;
        } else {
          actualRatio = Math.max(actualRatio, MIN_AR);
          width = innerWidth;
          height = Math.max(1, Math.floor(innerWidth / actualRatio));
        }

        width = oddSize(width);
        height = oddSize(height);
        appContainer.style.marginTop =
          Math.floor((innerHeight - height) / 2 - bannerSize) + "px";
        appContainer.style.width = width + "px";
        appContainer.style.height = height + "px";
        var dpi = 1;

        dpi = window.devicePixelRatio || 1;

        gameCanvas.width = oddSize(Math.floor(width * dpi));
        gameCanvas.height = oddSize(Math.floor(height * dpi));
      }

      function handleFileDownloadError(fileName) {
        console.error("Failed to download file: " + fileName);
        retryConnection();
      }

      function retryConnection() {
        const urlParams = new URLSearchParams(window.location.search);
        let attempt = parseInt(urlParams.get("attempt")) || 1;

        if (attempt >= maxAttempts) {
          console.error("Max retry attempts reached");
          return false;
        }

        console.log(
          `Attempt ${attempt} failed. Retrying in ${retryInterval} ms...`
        );

        attempt++;
        const url = new URL(window.location.href);
        url.searchParams.set("attempt", attempt);
        setTimeout(() => {
          window.location.href = url.toString();
        }, retryInterval);
        return true;
      }

      function hideWarning() {
        const warning = document.querySelector("#orientation-warning");
        warning.classList.remove("orientation-warning-is-visible");
      }

      function showWarning() {
        if (window.warning_closed_manually) {
          return;
        }
        const warning = document.querySelector("#orientation-warning");
        warning.classList.add("orientation-warning-is-visible");
      }

      function closeOrientationWarning() {
        window.warning_closed_manually = true;
        hideWarning();
      }

      function unpauseGame() {}

      function pauseGame() {}

      function checkOrientation() {
        if (
          window.orientation == undefined ||
          window.orientation == -90 ||
          window.orientation == 90
        ) {
          hideWarning();
          unpauseGame();
        } else {
          showWarning();
          pauseGame();
        }
        resizeGameCanvas();
      }
